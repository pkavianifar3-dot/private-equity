name: Validate Knowledge Base

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run non-destructive integrity validator
        id: validator
        continue-on-error: true
        run: |
          python tools/validate_atlas.py

      - name: Report validator status
        if: always()
        run: |
          if [ "${{ steps.validator.outcome }}" = "success" ]; then
            echo "Knowledge integrity validation passed."
          else
            echo "::warning::Knowledge integrity validation reported issues."
            echo "This workflow is intentionally non-blocking during Stage 1."
          fi
