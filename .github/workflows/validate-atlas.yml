name: Validate Atlas

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  validate-atlas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate Atlas
        run: python atlas/tools/validate-atlas.py

      - name: Generate indexes
        run: python atlas/tools/build-index.py

      - name: Check generated indexes
        run: git diff --exit-code -- atlas/entities/index.json atlas/claims/index.json atlas/evidence/index.json atlas/sources/index.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Atlas JavaScript syntax
        run: node --check assets/js/atlas.js
      - name: Check Atlas renderer pages
        run: |
          test -f atlas/person.html
          test -f atlas/organization.html
          test -f atlas/investment.html
          test -f atlas/concept.html
      - name: Test Atlas renderer structure
        run: node tests/atlas-renderer.test.js
