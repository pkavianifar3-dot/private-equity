name: Validate Atlas

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privatecapital-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-atlas:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      pages-ready: ${{ steps.publication.outputs.ready }}
    steps:
      - name: Checkout the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.14.0"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Install constrained Python dependencies
        run: python -m pip install -r requirements.txt -c requirements-release.txt

      - name: Validate, test, build, check drift and inspect the candidate
        run: python tools/release.py verify --ci --output "$RUNNER_TEMP/privatecapital-site"

      - name: Report candidate eligibility without exposing its files
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'privatecapital-site.manifest.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Release verification\n\n')
              summary.write(f"Commit: `{report['commit']}`\n\n")
              summary.write(f"Artifact SHA-256: `{report['artifact_sha256']}`\n\n")
              summary.write(f"Checked {report['checks']['files']} files; {report['checks']['sitemap_urls']} sitemap URLs.\n\n")
              summary.write(f"Publication blockers: **{len(report['publication_blockers'])}**. Files remain on this runner; no preview artifact is uploaded.\n")
          PY

      # No feature branch/PR can enter this step. Activation requires a separate
      # approved Pages-settings migration and ADR-004 public projection.
      - name: Gate production upload on approved publication and Pages source
        id: publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_RELEASE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release.py publication --output "$RUNNER_TEMP/privatecapital-site"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)" = workflow
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload only the verified public artifact
        if: steps.publication.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.sha }}
          path: ${{ runner.temp }}/privatecapital-site
          retention-days: 1

  deploy:
    needs: validate-atlas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.validate-atlas.outputs.pages-ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No checkout or build here: this job deploys the artifact from the
      # successful gate in THIS run, named after THIS immutable commit.
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1, Node 24
        with:
          artifact_name: github-pages-${{ github.sha }}
