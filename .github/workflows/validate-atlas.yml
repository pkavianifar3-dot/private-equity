name: Validate Atlas

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_authorized:
        description: "Explicit authorization for this run to publish (gate must also be on)"
        type: boolean
        default: false
      recovery_run_id:
        description: "Approved successful main run ID; blank for normal verification/release"
        type: string
        default: ""
      recovery_artifact_id:
        description: "Exact immutable recovery artifact ID from that run"
        type: string
        default: ""
      recovery_sha:
        description: "Full SHA of the approved source bundle"
        type: string
        default: ""
      recovery_kind:
        description: "Approved bundle kind; emergency restores only standalone Home/404"
        type: choice
        options: [public, emergency]
        default: public
      recovery_dry_run:
        description: "Verify/prepare recovery without authorizing upload/deploy"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: privatecapital-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-atlas:
    if: github.event_name != 'workflow_dispatch' || inputs.recovery_run_id == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
      actions: read
    outputs:
      pages-ready: ${{ steps.publication.outputs.ready }}
    steps:
      - name: Checkout the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.sha }}
          # Historical public-bundle regression needs the actual baseline tree.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.14.0"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Install constrained Python dependencies
        run: python -m pip install -r requirements.txt -c requirements-release.txt

      - name: Install pinned public-search build dependency
        run: npm ci --ignore-scripts

      - name: Validate, test, build, check drift and inspect the candidate
        run: python tools/release.py verify --ci --output "$RUNNER_TEMP/privatecapital-site"

      - name: Recheck publication and archive only the public bundle
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/recovery.py create --output "$RUNNER_TEMP/privatecapital-site" --report "$RUNNER_TEMP/privatecapital-site.manifest.json" --bundle "$RUNNER_TEMP/public-recovery"
          python tools/recovery.py rehearse --bundle "$RUNNER_TEMP/public-recovery" --output "$RUNNER_TEMP/recovery-rehearsal"

      - name: Retain public-only candidate and separate manifest (not deployment approval)
        id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-recovery-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-recovery
          retention-days: 30
          if-no-files-found: error

      - name: Verify actual retention after archival
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_ID: ${{ steps.archive.outputs.artifact-id }}
        run: python tools/recovery.py retention --artifact-id "$BUNDLE_ID" --bundle "$RUNNER_TEMP/public-recovery"

      - name: Build and rehearse independent emergency bundle (not the normal site)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/recovery.py create --kind emergency --output "$RUNNER_TEMP/emergency-site" --bundle "$RUNNER_TEMP/emergency-recovery"
          python tools/recovery.py rehearse --bundle "$RUNNER_TEMP/emergency-recovery" --output "$RUNNER_TEMP/emergency-rehearsal"

      - name: Retain separate emergency bundle and manifest
        id: emergency-archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: emergency-recovery-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/emergency-recovery
          retention-days: 30
          if-no-files-found: error

      - name: Download and verify emergency bundle retention and recovery
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_ID: ${{ steps.emergency-archive.outputs.artifact-id }}
        run: python tools/recovery.py retention --artifact-id "$BUNDLE_ID" --bundle "$RUNNER_TEMP/emergency-recovery"

      - name: Report candidate eligibility without exposing its files
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'privatecapital-site.manifest.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Release verification\n\n')
              summary.write(f"Commit: `{report['commit']}`\n\n")
              summary.write(f"Artifact SHA-256: `{report['artifact_sha256']}`\n\n")
              summary.write(f"Checked {report['checks']['files']} files; {report['checks']['sitemap_urls']} sitemap URLs.\n\n")
              summary.write(f"Publication blockers: **{len(report['publication_blockers'])}**. Only the checked public bundle and separate manifest are retained for 30 days. This is not deploy approval; feature/PR bundles cannot be recovery sources.\n")
          PY

      # No feature branch/PR can enter this step. Activation requires a separate
      # approved Pages-settings migration and ADR-004 public projection.
      - name: Gate production upload on approved publication and Pages source
        id: publication
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release_authorized && vars.PAGES_RELEASE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_RELEASE_ENABLED: ${{ vars.PAGES_RELEASE_ENABLED }}
          RELEASE_AUTHORIZED: ${{ inputs.release_authorized }}
        run: |
          python tools/recovery.py gate
          python tools/release.py publication --output "$RUNNER_TEMP/privatecapital-site"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)" = workflow
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload only the verified public artifact
        if: steps.publication.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.sha }}
          path: ${{ runner.temp }}/privatecapital-site
          retention-days: 30

  recover-prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_run_id != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: read
    outputs:
      pages-ready: ${{ steps.ready.outputs.ready }}
    steps:
      - name: Checkout current approved recovery implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.0"
      - run: python -m pip install -r requirements.txt -c requirements-release.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install pinned recovery search checker
        run: npm ci --ignore-scripts
      - name: Verify immutable artifact provenance and download bounded bundle
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.recovery_run_id }}
          SOURCE_ARTIFACT: ${{ inputs.recovery_artifact_id }}
          SOURCE_SHA: ${{ inputs.recovery_sha }}
          SOURCE_KIND: ${{ inputs.recovery_kind }}
        run: python tools/recovery.py fetch --run-id "$SOURCE_RUN" --artifact-id "$SOURCE_ARTIFACT" --sha "$SOURCE_SHA" --kind "$SOURCE_KIND" --bundle "$RUNNER_TEMP/recovery-input"
      - name: Checkout only the verified historical source for content checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.source-sha }}
          path: recovery-source
          persist-credentials: false
      - name: Recheck bytes, links and old/current publication boundaries; rehearse Pages tar
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/recovery.py rehearse --source-root "$GITHUB_WORKSPACE/recovery-source" --bundle "$RUNNER_TEMP/recovery-input" --output "$RUNNER_TEMP/recovered-site"
      - name: Authorize preparation for deployment (dry run never enters this step)
        id: ready
        if: inputs.release_authorized && !inputs.recovery_dry_run && vars.PAGES_RELEASE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_RELEASE_ENABLED: ${{ vars.PAGES_RELEASE_ENABLED }}
          RELEASE_AUTHORIZED: ${{ inputs.release_authorized }}
        run: |
          python tools/recovery.py gate
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Convert only recovered public directory to the official Pages artifact
        if: steps.ready.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: github-pages-${{ github.sha }}
          path: ${{ runner.temp }}/recovered-site
          retention-days: 30

  deploy:
    needs: [validate-atlas, recover-prepare]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release_authorized && vars.PAGES_RELEASE_ENABLED == 'true' && (needs.validate-atlas.outputs.pages-ready == 'true' || needs.recover-prepare.outputs.pages-ready == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout safeguards only; do not rebuild the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck authorization, Actions source and current main after Environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_RELEASE_ENABLED: ${{ vars.PAGES_RELEASE_ENABLED }}
          RELEASE_AUTHORIZED: ${{ inputs.release_authorized }}
        run: python tools/recovery.py gate
      - name: Deploy the verified artifact from this run only
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          artifact_name: github-pages-${{ github.sha }}
