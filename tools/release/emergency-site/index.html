<!doctype html>
<html lang="fa" dir="rtl" data-emergency-site="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="color-scheme" content="dark light">
  <link rel="canonical" href="https://privatecapital.ir/">
  <title>Private Capital | نسخهٔ اضطراری</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #091421; color: #e5edf5; font-family: Tahoma, Arial, sans-serif; padding: 24px; }
    main { width: min(100%, 640px); border: 1px solid #334252; border-radius: 16px; padding: clamp(24px, 6vw, 48px); }
    .brand { color: #dfb835; font-size: 24px; font-weight: bold; margin: 0 0 28px; }
    .label { color: #c6cfdb; font-size: 14px; }
    h1 { font-size: clamp(23px, 4vw, 32px); line-height: 1.7; margin: 12px 0; }
    p { line-height: 2; }
    .note { border-top: 1px solid #334252; padding-top: 20px; color: #bcc9d6; font-size: 14px; }
  </style>
</head>
<body>
  <main id="main">
    <p class="brand" dir="ltr">Private Capital</p>
    <span class="label">نسخهٔ اضطراری سایت</span>
    <h1>سایت به‌طور موقت در حال بازیابی است</h1>
    <p>این صفحه برای حفظ دسترسی به دامنه فعال شده است. پژوهش‌ها و امکانات اطلس پس از بازگشت نسخهٔ اصلی دوباره در دسترس خواهند بود.</p>
    <p class="note">این نسخه جایگزین موقت است و محتوای پژوهشی یا داده‌های اطلس را ارائه نمی‌کند.</p>
  </main>
</body>
</html>
