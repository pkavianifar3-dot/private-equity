<!doctype html>
<html lang="fa" dir="rtl" data-emergency-site="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="color-scheme" content="dark light">
  <title>صفحه در دسترس نیست | Private Capital</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #091421; color: #e5edf5; font-family: Tahoma, Arial, sans-serif; padding: 24px; }
    main { width: min(100%, 640px); border: 1px solid #334252; border-radius: 16px; padding: clamp(24px, 6vw, 48px); }
    .brand { color: #dfb835; font-size: 24px; font-weight: bold; margin: 0 0 28px; }
    .label { color: #c6cfdb; font-size: 14px; }
    h1 { font-size: clamp(23px, 4vw, 32px); line-height: 1.7; }
    p { line-height: 2; }
    a { display: inline-block; color: #dfb835; padding: 12px 0; text-underline-offset: 5px; }
    a:hover { color: #ffe59a; }
    a:focus-visible { outline: 2px solid #dfb835; outline-offset: 5px; border-radius: 2px; }
  </style>
</head>
<body>
  <main id="main">
    <p class="brand" dir="ltr">Private Capital</p>
    <span class="label">نسخهٔ اضطراری سایت · 404</span>
    <h1>این صفحه فعلاً در دسترس نیست</h1>
    <p>سایت در وضعیت بازیابی است. صفحات پژوهش و اطلس در این نسخه ارائه نمی‌شوند.</p>
    <a href="/">بازگشت به صفحهٔ اصلی</a>
  </main>
</body>
